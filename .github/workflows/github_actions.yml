# 当前为GitHub Actions 的 YAML 文件，GitHub 检测到仓库有 push/PR 时就自动执行里面的步骤。
# 拉代码 → 装 Python → 装依赖 → 初始化数据库 → 后台启动 Flask → 等 Flask 就绪 → 跑 Locust → 上传 HTML 报告

name: 测试          # 流水线名称，GitHub 页面上显示

on:                # 什么时候触发
  push:
    branches: [main]      # main 分支有推送就触发
  pull_request:
    branches: [main]      # 有人提 PR（pre request） 到 main 也触发

jobs:          # 干什么活
  test:        # 第一个任务叫 test（随便起）
    runs-on: ubuntu-latest  # 在 GitHub 提供的 Ubuntu 虚拟机上跑
    strategy:
      matrix:    # matrix 多版本策略—— 同一套测试，让 GitHub 同时在 Python 3.12 和 3.13 上各跑一遍。两个版本分别起一个 CI
        python-version: ['3.12', '3.13']
    steps:     # 任务分几步
      - uses: actions/checkout@v4        # 步骤1：拉代码 。@v4:2负责拉代码的脚本，目前迭代到第 4 版（官方维护，最新且最稳定的大版本自动化脚本）
      - uses: actions/setup-python@v5    # 步骤2：装 Python。 @v5:负责装 Python 的脚本，目前迭代到第 5 版（官方维护，最新且最稳定的大版本自动化脚本）
        with:
          python-version: ${{ matrix.python-version }}
#      - run: pip install -r requirements.txt     # 步骤3：装依赖
#      - run: pytest tests/ -v --ignore-glob=tests/test_ui_*.py --alluredir=allure-results # 步骤4：跑测试（指定目录），并忽略部分用例（因 Dockerfile 中配置了装了slim 版的 python，没有浏览器，故无法执行 UI测试，这里跳过了）

      - run: bash scripts/run_tests.sh   # 用 shell 脚本替代上面两行。shell 脚本内部，其实就是上面两行。本地和 CI 共用同一份脚本

      # artifact 作用：跑完 pytest 后生成 Allure 的 JSON 结果，然后上传到 GitHub，之后可以在 Actions 页面下载。
      - uses: actions/upload-artifact@v4      # 步骤 5：用上传脚本，把步骤4中 allure-results 目录上传上传到 github
        with:
          name: allure-results     # 产物在 GitHub Actions 页面上的显示名称，随便起，叫什么都行
          path: allure-results/    # 上传哪个目录，就是上一步 pytest 生成 allure-results/ 目录

      # ⬆️ push 到 github 后，Actions自动执行当前文件，生成阿里allure 的 json 文件
      # Actions 点进去对应测试记录--页面底部可以下载文件。下载后解压，本地用 allure serve .的方式生成 HTML测试报告

  perf-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -c "from app.models import init_db; init_db('ecommerce.db')"   # -c = command。作用：直接在命令行执行一段 Python 代码，不用新建 .py 文件。
      - run: |           # 丨 这个符号——它表示「下面的多行是一个整体，当成一个 step 执行」。
          # 后台启动 Flask
          python -c "from app import app; app.run(host='127.0.0.1', port=5000)" &
          
          # 最后的 & 是什么？Shell 里 & 表示「放到后台运行，不等它结束，立刻返回」。
          # 不加 & 的话，Flask 会一直阻塞，后面的 curl 和 locust 永远执行不到。
          
          # 等待 Flask 就绪（最多等 15 秒）
          echo "等待 Flask 启动..."
          for i in $(seq 1 15); do   # $(命令) 是 shell命令替换，把括号内 1～15 所有数字拼成一串空格隔开的值：1 2 3 ... 15
            curl -s http://127.0.0.1:5000/ && break
            sleep 1
          done
          
          # do → 循环体开始，for 循环 shell 中固定写法
          # seq 1 15 → 生成 1 到 15 共 15 个数字
          # for i in ... → 循环最多 15 次
          # curl -s http://127.0.0.1:5000/ → 发一个请求试探 Flask 是否响应
          # && break → 如果 curl 成功（Flask 响应了），立刻退出循环。举例：cmd1 && cmd2 → 逻辑与：cmd1 成功才执行 cmd2
          # sleep 1 → curl 失败就等 1 秒再试
          # 15 次后还没成功，循环自然结束
          # done → 循环体结束
          # VAR=xxx / $VAR — 变量定义和使用
          # if [ "$X" = "prod" ]; then ... else ... fi — 条件判断

          # 跑 Locust（LoadTestShape 自动控制阶段）
          locust -f locustfile.py --headless --host=http://127.0.0.1:5000 --html=locust-report.html

          # 停掉 Flask
          kill %1   # 这是数字 1, 杀掉后台 1 号进程
      - uses: actions/upload-artifact@v4
        with:
          name: locust-report
          path: locust-report.html